services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5415:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag
    ports:
      - "8562:8000"
    expose:
      - 8562
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/code/app
      - ./data:/code/data
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
